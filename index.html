<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./main.css"/>
</head>
<body>
    <div class="container">
        <header>
            <img src="./media/icons8-lista.gif" alt="ícone lista de tarefas"/>
            <h1>Lista de Tarefas</h1>
            <h2>Adicione suas principais tarefas do dia</h2>
        </header>
        <form>
            <input type="text" id="campo-digitar-tarefa" placeholder="Digite sua terefa" required/>
            <button type="submit">Adicionar</button>
        </form>
        <ul id="lista">
        </ul>
        <p>Clique para marcar quando a tarefa for concluída.</p>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="./main.js"></script>
</body>
</html>
